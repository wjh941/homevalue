[project]
name = "homevalue"
version = "0.1.0"
description = "房价预测与估值平台:数据管道 → SQL 分析 → 建模 → FastAPI 服务 → 仪表盘"
requires-python = ">=3.10"
dependencies = [
  "numpy>=2.0",
  "pandas>=3.0",
  "scikit-learn>=1.9",
  "lightgbm>=4.7",
  "joblib>=1.6",
  "sqlalchemy>=2.0",
  "fastapi>=0.141",
  "uvicorn>=0.41",
  "matplotlib>=3.11",
  "httpx>=0.28",
  "requests>=2.31",
  "pytest>=8.4",
  "ruff>=0.8",
]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
